name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=v1.0.${{ github.run_number }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Docker requires image names to be completely lowercase
            REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Pull the specific version that was just pushed to GHCR
            docker pull ghcr.io/${REPO}:v1.0.${{ github.run_number }}
            
            # Stop and remove the old container if it exists
            docker stop bot-stimulator || true
            docker rm -f bot-stimulator || true
            
            # Ensure the resources directory exists and is writable by the non-root container user
            mkdir -p /opt/bot-stimulator/resources
            chmod 777 /opt/bot-stimulator/resources
            
            # Start the new container
            docker run -d \
              --name bot-stimulator \
              --restart unless-stopped \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e CRON_SCHEDULE="${{ secrets.CRON_SCHEDULE }}" \
              -v /opt/bot-stimulator/resources:/app/resources \
              ghcr.io/${REPO}:v1.0.${{ github.run_number }}
